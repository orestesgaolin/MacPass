name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"
  workflow_dispatch:

env:
  SCHEME: MacPass
  PROJECT: MacPass.xcodeproj
  CONFIGURATION: Release
  APP_NAME: MacPass
  BUNDLE_ID: dev.roszkowski.macpass

jobs:
  build-sign-notarize:
    runs-on: macos-15
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Dependencies ────────────────────────────────────────────
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install Carthage
        run: brew install carthage create-dmg

      - name: Install changelog_cli
        run: |
          brew trust --formula orestesgaolin/tap/changelog_cli
          brew tap orestesgaolin/tap
          brew install changelog_cli

      - name: Fetch Dependencies
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve, checkout sources, and download binary deps (Sparkle)
          # without building anything — Carthage's build is broken on arm64 Xcode 16
          carthage bootstrap --no-build

      - name: Fix TransformerKit Compatibility
        run: |
          chmod +x scripts/fix_transformerkit.sh
          ./scripts/fix_transformerkit.sh

      - name: Build Frameworks
        run: |
          set -euo pipefail
          mkdir -p Carthage/Build/Mac

          # Download Sparkle binary (not handled by --no-build)
          SPARKLE_VERSION=$(grep -i sparkle Cartfile.resolved | grep -oE '"[0-9][^"]*"' | tail -1 | tr -d '"')
          echo "Downloading Sparkle $SPARKLE_VERSION..."
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/Sparkle.tar.xz
          mkdir -p /tmp/Sparkle && tar xf /tmp/Sparkle.tar.xz -C /tmp/Sparkle
          cp -R /tmp/Sparkle/Sparkle.framework Carthage/Build/Mac/

          echo "::group::Building HNHUi"
          xcodebuild build \
            -project Carthage/Checkouts/HNHUi/HNHUi.xcodeproj \
            -scheme HNHUi \
            -configuration Release \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=/tmp/HNHUi-build OBJROOT=/tmp/HNHUi-obj
          cp -R /tmp/HNHUi-build/Release/HNHUi.framework Carthage/Build/Mac/
          echo "::endgroup::"

          echo "::group::Building KissXML"
          xcodebuild build \
            -project Carthage/Checkouts/KissXML/KissXML.xcodeproj \
            -scheme "KissXML (macOS)" \
            -configuration Release \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=/tmp/KissXML-build OBJROOT=/tmp/KissXML-obj
          cp -R /tmp/KissXML-build/Release/KissXML.framework Carthage/Build/Mac/
          echo "::endgroup::"

          echo "::group::Building KeePassKit"
          # KeePassKit looks for KissXML in its own Carthage/Build/Mac/
          mkdir -p Carthage/Checkouts/KeePassKit/Carthage/Build/Mac
          ln -sf "$(pwd)/Carthage/Build/Mac/KissXML.framework" \
            Carthage/Checkouts/KeePassKit/Carthage/Build/Mac/KissXML.framework
          xcodebuild build \
            -project Carthage/Checkouts/KeePassKit/KeePassKit.xcodeproj \
            -target "KeePassKit macOS" \
            -configuration Release \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=/tmp/KeePassKit-build OBJROOT=/tmp/KeePassKit-obj
          cp -R /tmp/KeePassKit-build/Release/KeePassKit.framework Carthage/Build/Mac/
          echo "::endgroup::"

          echo "::group::Building TransformerKit"
          xcodebuild build \
            -workspace Carthage/Checkouts/TransformerKit/TransformerKit.xcworkspace \
            -scheme "TransformerKit macOS" \
            -configuration Release \
            -derivedDataPath /tmp/TransformerKit-build \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cp -R /tmp/TransformerKit-build/Build/Products/Release/TransformerKit.framework \
            Carthage/Build/Mac/
          echo "::endgroup::"

          # Verify all required frameworks
          echo "Checking frameworks..."
          for fw in KeePassKit HNHUi TransformerKit KissXML Sparkle; do
            binary="Carthage/Build/Mac/$fw.framework/$fw"
            if [ ! -f "$binary" ]; then
              echo "❌ $fw.framework not found"
              ls -la Carthage/Build/Mac/ || true
              exit 1
            fi
            architectures="$(lipo -archs "$binary")"
            if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
              echo "$fw.framework is not universal: $architectures" >&2
              exit 1
            fi
            echo "  ✅ $fw.framework ($architectures)"
          done

      # ── Import Signing Certificates ─────────────────────────────
      - name: Import Certificates
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          set -euo pipefail
          APP_CERT_PATH=$RUNNER_TEMP/app_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)

          # Decode certificate
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$APP_CERT_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import the Developer ID certificate and its private key.
          security import "$APP_CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A \
            -t agg \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F -q "\"$CERT_NAME\""

          # Export for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ── Build ───────────────────────────────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Build MacPass
        run: |
          set -o pipefail

          # Version from tag (strip leading 'v' if present), build number from GH run
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          BUNDLE_VERSION="${VERSION%%[-+]*}"
          if [[ ! "$BUNDLE_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid numeric bundle version derived from $VERSION" >&2
            exit 1
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building version $VERSION, bundle version $BUNDLE_VERSION (build $BUILD_NUMBER)"

          xcodebuild build \
            -configuration "$CONFIGURATION" \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$BUNDLE_VERSION" \
            -derivedDataPath ./build \
            | xcpretty -c

          # Stamp version and build number into the built app
          APP_PLIST="./build/Build/Products/$CONFIGURATION/$APP_NAME.app/Contents/Info.plist"
          EXTENSION="./build/Build/Products/$CONFIGURATION/$APP_NAME.app/Contents/PlugIns/MacPassAutoFill.appex"
          EXTENSION_PLIST="$EXTENSION/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BUNDLE_VERSION" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BUNDLE_VERSION" "$EXTENSION_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$EXTENSION_PLIST"
          scripts/validate_autofill_product.sh \
            "./build/Build/Products/$CONFIGURATION/$APP_NAME.app" "arm64 x86_64"
          echo "Stamped version: $VERSION, build: $BUILD_NUMBER"

          # Make version available to later steps
          {
            echo "VERSION=$VERSION"
            echo "BUNDLE_VERSION=$BUNDLE_VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      # ── Code Sign ───────────────────────────────────────────────
      # Built with signing disabled and then sign manually with codesign.
      - name: Code Sign Frameworks and App
        env:
          CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
          MACOS_AUTOFILL_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_AUTOFILL_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          BUILD_DIR="./build/Build/Products/$CONFIGURATION"
          APP="$BUILD_DIR/$APP_NAME.app"
          EXTENSION="$APP/Contents/PlugIns/MacPassAutoFill.appex"
          FRAMEWORKS="$APP/Contents/Frameworks"
          ENTITLEMENTS_APP="$RUNNER_TEMP/MacPass-Developer-ID-app.entitlements"
          ENTITLEMENTS_EXTENSION="$RUNNER_TEMP/MacPassAutoFill-Developer-ID.entitlements"
          APP_PROFILE="$RUNNER_TEMP/macpass.provisionprofile"
          EXTENSION_PROFILE="$RUNNER_TEMP/macpass-autofill.provisionprofile"
          APP_PROFILE_PLIST="$RUNNER_TEMP/macpass-profile.plist"
          EXTENSION_PROFILE_PLIST="$RUNNER_TEMP/macpass-autofill-profile.plist"
          SHARED_GROUP="group.dev.roszkowski.macpass"
          EXTENSION_BUNDLE_ID="$BUNDLE_ID.autofill"

          : "${MACOS_PROVISIONING_PROFILE_BASE64:?Missing host Developer ID provisioning profile}"
          : "${MACOS_AUTOFILL_PROVISIONING_PROFILE_BASE64:?Missing AutoFill Developer ID provisioning profile}"
          test -d "$EXTENSION"

          cp "MacPass/MacPass-Developer-ID.entitlements" "$ENTITLEMENTS_APP"
          cp "MacPassAutoFill/MacPassAutoFill.entitlements" "$ENTITLEMENTS_EXTENSION"

          echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE"
          echo "$MACOS_AUTOFILL_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$EXTENSION_PROFILE"
          security cms -D -i "$APP_PROFILE" > "$APP_PROFILE_PLIST"
          security cms -D -i "$EXTENSION_PROFILE" > "$EXTENSION_PROFILE_PLIST"

          SIGNING_CERTIFICATE_DER="$RUNNER_TEMP/signing-certificate.der"
          security find-certificate -c "$CERT_NAME" -p "$KEYCHAIN_PATH" | \
            openssl x509 -outform der > "$SIGNING_CERTIFICATE_DER"

          validate_profile() {
            local profile="$1"
            local bundle_id="$2"
            local prefix="$3"
            shift 3
            python3 scripts/validate_autofill_profile.py \
              "$profile" "$TEAM_ID" "$bundle_id" "$SHARED_GROUP" "$prefix" \
              "$SIGNING_CERTIFICATE_DER" "$@"
          }

          APP_PREFIX="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$APP_PROFILE_PLIST")"
          EXTENSION_PREFIX="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$EXTENSION_PROFILE_PLIST")"
          test "$APP_PREFIX" = "$EXTENSION_PREFIX"
          APP_IDENTIFIER="$APP_PREFIX$BUNDLE_ID"
          EXTENSION_IDENTIFIER="$APP_PREFIX$EXTENSION_BUNDLE_ID"
          SHARED_KEYCHAIN_GROUP="${APP_PREFIX}dev.roszkowski.macpass.shared"
          validate_profile "$APP_PROFILE_PLIST" "$BUNDLE_ID" "$APP_PREFIX" \
            "$APP_IDENTIFIER" "$SHARED_KEYCHAIN_GROUP"
          validate_profile "$EXTENSION_PROFILE_PLIST" "$EXTENSION_BUNDLE_ID" "$APP_PREFIX" \
            --sandboxed "$SHARED_KEYCHAIN_GROUP"

          CERT_TEAM="$(security find-certificate -c "$CERT_NAME" -p "$KEYCHAIN_PATH" | \
            openssl x509 -noout -subject -nameopt RFC2253 | tr ',' '\n' | sed -n 's/^OU=//p' | head -n 1)"
          test "$CERT_TEAM" = "$TEAM_ID"

          cp "$APP_PROFILE" "$APP/Contents/embedded.provisionprofile"
          cp "$EXTENSION_PROFILE" "$EXTENSION/Contents/embedded.provisionprofile"

          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $APP_IDENTIFIER" "$ENTITLEMENTS_APP"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$ENTITLEMENTS_APP"
          /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:0 $APP_IDENTIFIER" "$ENTITLEMENTS_APP"
          /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:1 $SHARED_KEYCHAIN_GROUP" "$ENTITLEMENTS_APP"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $EXTENSION_IDENTIFIER" "$ENTITLEMENTS_EXTENSION"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$ENTITLEMENTS_EXTENSION"
          /usr/libexec/PlistBuddy -c "Set :keychain-access-groups:0 $SHARED_KEYCHAIN_GROUP" "$ENTITLEMENTS_EXTENSION"

          echo "::group::Signing embedded frameworks"

          # Sign Sparkle 2.x components (innermost first)
          SPARKLE="$FRAMEWORKS/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            echo "Signing Sparkle components..."

            # XPC Services
            for xpc in "$SPARKLE/Versions/B/XPCServices/"*.xpc; do
              if [ -d "$xpc" ]; then
                echo "  Signing $(basename "$xpc")..."
                codesign --sign "$CERT_NAME" --options runtime --force --timestamp \
                  --preserve-metadata=entitlements "$xpc"
              fi
            done

            # Autoupdate helper
            if [ -f "$SPARKLE/Versions/B/Autoupdate" ]; then
              echo "  Signing Autoupdate..."
              codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$SPARKLE/Versions/B/Autoupdate"
            fi

            # Updater.app
            if [ -d "$SPARKLE/Versions/B/Updater.app" ]; then
              echo "  Signing Updater.app..."
              codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$SPARKLE/Versions/B/Updater.app"
            fi

            # Sign the framework itself
            echo "  Signing Sparkle.framework..."
            codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$SPARKLE"
          fi

          # Sign remaining frameworks
          for fw in TransformerKit KeePassKit KissXML HNHUi; do
            FW_PATH="$FRAMEWORKS/${fw}.framework"
            if [ -d "$FW_PATH" ]; then
              echo "Signing $fw..."
              codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$FW_PATH"
            fi
          done

          echo "::endgroup::"

          echo "Signing MacPassAutoFill.appex..."
          codesign --sign "$CERT_NAME" --options runtime --force --timestamp \
            --entitlements "$ENTITLEMENTS_EXTENSION" "$EXTENSION"

          echo "Signing $APP_NAME.app..."
          codesign --sign "$CERT_NAME" --options runtime --force --timestamp --entitlements "$ENTITLEMENTS_APP" "$APP"

          echo "Verifying signature..."
          codesign --verify --strict --verbose=2 "$EXTENSION"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$EXTENSION" > "$RUNNER_TEMP/macpass-autofill-signed-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/macpass-signed-entitlements.plist"
          python3 scripts/validate_autofill_signed_entitlements.py \
            "$RUNNER_TEMP/macpass-signed-entitlements.plist" \
            "$RUNNER_TEMP/macpass-autofill-signed-entitlements.plist" \
            "$TEAM_ID" "$APP_PREFIX"

      # ── Notarize ────────────────────────────────────────────────
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APP_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          BUILD_DIR="./build/Build/Products/$CONFIGURATION"
          APP="$BUILD_DIR/$APP_NAME.app"

          echo "Creating zip for notarization submission..."
          ditto -c -k --keepParent "$APP" "$BUILD_DIR/$APP_NAME-notarize.zip"

          echo "Submitting to Apple notarization service..."
          RESULT=$(xcrun notarytool submit "$BUILD_DIR/$APP_NAME-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PWD" \
            --wait \
            --timeout 30m \
            --output-format json) || true

          echo "$RESULT"
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','Unknown'))")
          SUB_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ Notarization failed with status: $STATUS"
            if [ -n "$SUB_ID" ]; then
              echo "Fetching notarization log..."
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" \
                --password "$APP_PWD"
            fi
            exit 1
          fi

          echo "✅ Notarization accepted"
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP"

          echo "Verifying notarization..."
          spctl --assess --type exec -vvv "$APP"

      # ── Package as DMG ──────────────────────────────────────────
      - name: Create DMG Installer
        run: |
          BUILD_DIR="./build/Build/Products/$CONFIGURATION"
          APP="$BUILD_DIR/$APP_NAME.app"

          echo "Creating DMG installer..."
          create-dmg \
            --volname "$APP_NAME $VERSION" \
            --icon "$APP_NAME.app" 175 120 \
            --app-drop-link 425 120 \
            "$BUILD_DIR/$APP_NAME-$VERSION.dmg" \
            "$APP"

          echo "DMG_PATH=$BUILD_DIR/$APP_NAME-$VERSION.dmg" >> "$GITHUB_ENV"

      # ── Notarize DMG ────────────────────────────────────────────
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APP_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          echo "Submitting DMG to Apple notarization service..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PWD" \
            --wait \
            --timeout 30m

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "$DMG_PATH"

      - name: Validate Packaged AutoFill Product
        env:
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          set -euo pipefail
          MOUNT_POINT="$RUNNER_TEMP/macpass-release-volume"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG_PATH"
          trap 'hdiutil detach "$MOUNT_POINT"' EXIT

          APP="$MOUNT_POINT/$APP_NAME.app"
          EXTENSION="$APP/Contents/PlugIns/MacPassAutoFill.appex"
          APP_PROFILE_PLIST="$RUNNER_TEMP/packaged-macpass-profile.plist"
          APP_ENTITLEMENTS="$RUNNER_TEMP/packaged-macpass-entitlements.plist"
          EXTENSION_ENTITLEMENTS="$RUNNER_TEMP/packaged-autofill-entitlements.plist"

          scripts/validate_autofill_product.sh "$APP" "arm64 x86_64"
          test -f "$APP/Contents/embedded.provisionprofile"
          test -f "$EXTENSION/Contents/embedded.provisionprofile"
          codesign --verify --deep --strict --verbose=4 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG_PATH"

          security cms -D -i "$APP/Contents/embedded.provisionprofile" > "$APP_PROFILE_PLIST"
          APP_PREFIX="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationIdentifierPrefix:0' "$APP_PROFILE_PLIST")"
          codesign -d --entitlements :- "$APP" > "$APP_ENTITLEMENTS"
          codesign -d --entitlements :- "$EXTENSION" > "$EXTENSION_ENTITLEMENTS"
          python3 scripts/validate_autofill_signed_entitlements.py \
            "$APP_ENTITLEMENTS" "$EXTENSION_ENTITLEMENTS" "$TEAM_ID" "$APP_PREFIX"

          patterns='resolved-secret|trashed-secret|Test_Password_1234|AutoFill_KDBX4_Password|AutoFill_KeyFileV2|https://example\.com|/tmp/Database\.kdbx'
          if LC_ALL=C grep -R -a -E -l "$patterns" "$APP" > "$RUNNER_TEMP/autofill-release-findings.txt"; then
            echo "AutoFill fixture data was found in the packaged release application." >&2
            while IFS= read -r path; do echo "::error file=$path::Sensitive AutoFill fixture marker found"; done \
              < "$RUNNER_TEMP/autofill-release-findings.txt"
            exit 1
          fi

      # ── SHA256 ──────────────────────────────────────────────────
      - name: Generate SHA256 Hashes
        run: |
          shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"

          {
            echo "### SHA256 Checksums"
            echo '```'
            cat "$DMG_PATH.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Attestation ─────────────────────────────────────────────
      - name: Attest Build Provenance (DMG)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.DMG_PATH }}

      # ── Generate Changelog ──────────────────────────────────────
      - name: Generate Changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$CURRENT_TAG" == *-* ]]; then
              # Pre-release (e.g. 1.2.3-rc1): find the tag of the most recent GH release (any)
              PREV_TAG=$(gh release list --limit 50 --json tagName,isDraft \
                -q '[.[] | select(.isDraft == false) | .tagName] | map(select(. != "'"$CURRENT_TAG"'")) | first // empty' 2>/dev/null || echo "")
            else
              # Stable release (e.g. 1.2.3): find the tag of the most recent stable GH release (no suffix)
              PREV_TAG=$(gh release list --limit 50 --json tagName,isPrerelease,isDraft \
                -q '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName] | map(select(. != "'"$CURRENT_TAG"'" and (contains("-") | not))) | first // empty' 2>/dev/null || echo "")
            fi
            END_REF="$CURRENT_TAG"
          else
            # workflow_dispatch: find the tag of the most recent GH release
            PREV_TAG=$(gh release list --limit 1 --json tagName,isDraft \
              -q '[.[] | select(.isDraft == false)] | first // empty | .tagName // empty' 2>/dev/null || echo "")
            END_REF="HEAD"
          fi

          echo "Generating changelog: ${PREV_TAG:-beginning}..${END_REF}"

          CHANGELOG_ARGS=(-P markdown -e "$END_REF")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_ARGS+=(-s "$PREV_TAG")
          fi

          changelog_cli generate "${CHANGELOG_ARGS[@]}" -o /tmp/changelog.md || true

          if [ ! -s /tmp/changelog.md ]; then
            echo "No conventional commits found for changelog." > /tmp/changelog.md
          fi

          echo "Generated changelog:"
          cat /tmp/changelog.md

      # ── Publish ─────────────────────────────────────────────────
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build release body: changelog + attestation info
          cp /tmp/changelog.md /tmp/release-body.md

          cat >> /tmp/release-body.md << 'EOF'

          ----

          **Verification**

          This release was built with GitHub Actions and includes [SLSA build provenance attestations](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds).

          To verify the artifacts:

          ```bash
          gh attestation verify MacPass-${{ env.VERSION }}.dmg --owner ${{ github.repository_owner }}
          ```

          **Build Info**

          - **Version**: ${{ env.VERSION }}
          - **Build**: ${{ env.BUILD_NUMBER }}
          - **Runner**: macOS 15 (arm64)
          - **Commit**: ${{ github.sha }}
          EOF

          # Create release with changelog + attestation info
          PRERELEASE_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" \
            --title "MacPass ${{ env.VERSION }} (${{ env.BUILD_NUMBER }})" \
            --generate-notes \
            --notes-file /tmp/release-body.md \
            "${PRERELEASE_ARGS[@]}" \
            "${{ env.DMG_PATH }}" \
            "${{ env.DMG_PATH }}.sha256"

      # ── Upload Artifacts (for workflow_dispatch) ────────────────
      - name: Upload Build Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MacPass-${{ github.sha }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256

      # ── Cleanup ─────────────────────────────────────────────────
      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  # ════════════════════════════════════════════════════════════════
  # Update Sparkle Appcast
  # ════════════════════════════════════════════════════════════════
  update-appcast:
    needs: build-sign-notarize
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Wait for release to propagate
        run: |
          echo "Waiting 30s for the GitHub release to become visible via the API..."
          sleep 30

      - name: Generate Appcast XML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Start appcast XML
          cat > appcast.xml << 'HEADER'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>MacPass Updates</title>
              <link>https://github.com/$REPO</link>
              <description>Most recent changes with links to updates.</description>
              <language>en</language>
          HEADER

          # Rewrite the repo URL into the template
          sed -i "s|\$REPO|${REPO}|g" appcast.xml

          # Query all releases and generate items
          # sparkle:version must be numeric (for version comparison).
          # Parse build number from release name/title with or without prefix,
          # e.g. "MacPass 0.8.3+rc2 (19)" or "0.8.3+rc2 (19)".
          gh api "repos/${REPO}/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false)' | \
          jq -c '.' | while read -r release; do
            TAG=$(echo "$release" | jq -r '.tag_name')
            NAME=$(echo "$release" | jq -r '.name // .tag_name')
            PUB_DATE=$(echo "$release" | jq -r '.published_at')

            # Find the .dmg asset (exclude noSparkle variant — appcast is for Sparkle updates only)
            ZIP_URL=$(echo "$release" | jq -r '[.assets // [] | .[] | select((.name | endswith(".dmg")) and (.name | contains("noSparkle") | not))] | first // empty | .browser_download_url')
            ZIP_SIZE=$(echo "$release" | jq -r '[.assets // [] | .[] | select((.name | endswith(".dmg")) and (.name | contains("noSparkle") | not))] | first // empty | .size')
            if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
              continue
            fi

            # Parse numeric build number from a trailing "(N)"
            BUILD_NUM=$(echo "$NAME" | sed -nE 's/.*\(([0-9]+)\)[[:space:]]*$/\1/p' | head -n1)
            if [ -z "$BUILD_NUM" ]; then
              echo "Skipping release $TAG: could not parse build number from title '$NAME'"
              continue
            fi

            XML_NAME=$(python3 -c 'import html,sys; print(html.escape(sys.argv[1], quote=True))' "$NAME")
            XML_TAG=$(python3 -c 'import html,sys; print(html.escape(sys.argv[1], quote=True))' "$TAG")
            XML_URL=$(python3 -c 'import html,sys; print(html.escape(sys.argv[1], quote=True))' "$ZIP_URL")

            {
              printf '    <item>\n'
              printf '      <title>%s</title>\n' "$XML_NAME"
              printf '      <pubDate>%s</pubDate>\n' "$PUB_DATE"
              printf '      <sparkle:version>%s</sparkle:version>\n' "$BUILD_NUM"
              printf '      <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n' "$XML_TAG"
              printf '      <sparkle:minimumSystemVersion>10.14</sparkle:minimumSystemVersion>\n'
              printf '      <enclosure\n'
              printf '        url="%s"\n' "$XML_URL"
              printf '        length="%s"\n' "$ZIP_SIZE"
              printf '        type="application/octet-stream"\n'
              printf '        sparkle:version="%s"\n' "$BUILD_NUM"
              printf '        sparkle:shortVersionString="%s"\n' "$XML_TAG"
              printf '      />\n'
              printf '    </item>\n'
            } >> appcast.xml
          done

          # Close appcast XML
          cat >> appcast.xml << 'FOOTER'
            </channel>
          </rss>
          FOOTER

          xmllint --noout appcast.xml

          # Move to a dedicated directory for gh-pages deployment
          mkdir -p _site
          mv appcast.xml _site/appcast.xml

          echo "Generated appcast.xml:"
          cat _site/appcast.xml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
