name: Release

on:
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"
  workflow_dispatch:

env:
  SCHEME: MacPass
  PROJECT: MacPass.xcodeproj
  CONFIGURATION: Release
  APP_NAME: MacPass
  BUNDLE_ID: dev.roszkowski.macpass

jobs:
  build-sign-notarize:
    runs-on: macos-15
    environment: Production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Dependencies ────────────────────────────────────────────
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install Carthage
        run: brew install carthage

      - name: Install changelog_cli
        run: |
          brew tap orestesgaolin/tap
          brew install changelog_cli

      - name: Fetch Dependencies
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve, checkout sources, and download binary deps (Sparkle)
          # without building anything — Carthage's build is broken on arm64 Xcode 16
          carthage bootstrap --no-build

      - name: Fix TransformerKit Compatibility
        run: |
          chmod +x scripts/fix_transformerkit.sh
          ./scripts/fix_transformerkit.sh

      - name: Build Frameworks
        run: |
          set -euo pipefail
          mkdir -p Carthage/Build/Mac

          # Download Sparkle binary (not handled by --no-build)
          SPARKLE_VERSION=$(grep -i sparkle Cartfile.resolved | grep -oE '"[0-9][^"]*"' | tail -1 | tr -d '"')
          echo "Downloading Sparkle $SPARKLE_VERSION..."
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/Sparkle.tar.xz
          mkdir -p /tmp/Sparkle && tar xf /tmp/Sparkle.tar.xz -C /tmp/Sparkle
          cp -R /tmp/Sparkle/Sparkle.framework Carthage/Build/Mac/

          echo "::group::Building HNHUi"
          xcodebuild build \
            -project Carthage/Checkouts/HNHUi/HNHUi.xcodeproj \
            -scheme HNHUi \
            -configuration Release \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=/tmp/HNHUi-build OBJROOT=/tmp/HNHUi-obj
          cp -R /tmp/HNHUi-build/Release/HNHUi.framework Carthage/Build/Mac/
          echo "::endgroup::"

          echo "::group::Building KissXML"
          xcodebuild build \
            -project Carthage/Checkouts/KissXML/KissXML.xcodeproj \
            -scheme "KissXML (macOS)" \
            -configuration Release \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=/tmp/KissXML-build OBJROOT=/tmp/KissXML-obj
          cp -R /tmp/KissXML-build/Release/KissXML.framework Carthage/Build/Mac/
          echo "::endgroup::"

          echo "::group::Building KeePassKit"
          # KeePassKit looks for KissXML in its own Carthage/Build/Mac/
          mkdir -p Carthage/Checkouts/KeePassKit/Carthage/Build/Mac
          ln -sf "$(pwd)/Carthage/Build/Mac/KissXML.framework" \
            Carthage/Checkouts/KeePassKit/Carthage/Build/Mac/KissXML.framework
          xcodebuild build \
            -project Carthage/Checkouts/KeePassKit/KeePassKit.xcodeproj \
            -target "KeePassKit macOS" \
            -configuration Release \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT=/tmp/KeePassKit-build OBJROOT=/tmp/KeePassKit-obj
          cp -R /tmp/KeePassKit-build/Release/KeePassKit.framework Carthage/Build/Mac/
          echo "::endgroup::"

          echo "::group::Building TransformerKit"
          xcodebuild build \
            -workspace Carthage/Checkouts/TransformerKit/TransformerKit.xcworkspace \
            -scheme "TransformerKit macOS" \
            -configuration Release \
            -derivedDataPath /tmp/TransformerKit-build \
            ARCHS="arm64 x86_64" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cp -R /tmp/TransformerKit-build/Build/Products/Release/TransformerKit.framework \
            Carthage/Build/Mac/
          echo "::endgroup::"

          # Verify all required frameworks
          echo "Checking frameworks..."
          for fw in KeePassKit HNHUi TransformerKit KissXML Sparkle; do
            if [ ! -d "Carthage/Build/Mac/$fw.framework" ]; then
              echo "❌ $fw.framework not found"
              ls -la Carthage/Build/Mac/ || true
              exit 1
            fi
            echo "  ✅ $fw.framework"
          done

      # ── Import Signing Certificates ─────────────────────────────
      - name: Import Certificates
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
        run: |
          APP_CERT_PATH=$RUNNER_TEMP/app_certificate.p12
          INSTALLER_CERT_PATH=$RUNNER_TEMP/installer_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)

          # Decode certificates
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$APP_CERT_PATH"
          echo "$MACOS_INSTALLER_CERTIFICATE_P12" | base64 --decode > "$INSTALLER_CERT_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Import Developer ID Application certificate
          security import "$APP_CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Import Developer ID Installer certificate
          security import "$INSTALLER_CERT_PATH" \
            -P "$MACOS_INSTALLER_CERTIFICATE_PWD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign and productbuild to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Export for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # ── Build ───────────────────────────────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document --quiet

      - name: Build MacPass
        run: |
          set -o pipefail

          # Version from tag (strip leading 'v' if present), build number from GH run
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Building version $VERSION (build $BUILD_NUMBER)"

          xcodebuild build \
            -configuration "$CONFIGURATION" \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            ARCHS="arm64 x86_64" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            MARKETING_VERSION="$VERSION" \
            -derivedDataPath ./build \
            | xcpretty -c

          # Stamp version and build number into the built app
          APP_PLIST="./build/Build/Products/$CONFIGURATION/$APP_NAME.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP_PLIST"
          echo "Stamped version: $VERSION, build: $BUILD_NUMBER"

          # Make version available to later steps
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"

      # ── Code Sign ───────────────────────────────────────────────
      # Built with signing disabled and then sign manually with codesign.
      - name: Code Sign Frameworks and App
        env:
          CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          BUILD_DIR="./build/Build/Products/$CONFIGURATION"
          APP="$BUILD_DIR/$APP_NAME.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          ENTITLEMENTS_FRAMEWORK="$RUNNER_TEMP/MacPass-Developer-ID-framework.entitlements"
          ENTITLEMENTS_APP="$RUNNER_TEMP/MacPass-Developer-ID-app.entitlements"
          cp "MacPass/MacPass-Developer-ID.entitlements" "$ENTITLEMENTS_FRAMEWORK"
          cp "MacPass/MacPass-Developer-ID.entitlements" "$ENTITLEMENTS_APP"

          if [ -n "${MACOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Provisioning profile secret detected; embedding profile."
            APP_ID="${TEAM_ID}.${BUNDLE_ID}"
            PROFILE_PATH="$RUNNER_TEMP/macpass.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            cp "$PROFILE_PATH" "$APP/Contents/embedded.provisionprofile"

            # Only add com.apple.application-identifier (required for profile matching).
            # Do NOT add com.apple.developer.team-identifier or keychain-access-groups —
            # these are restricted entitlements that cause AMFI validation failures
            # ("Unsatisfied entitlements") if the profile can't fully authorize them.
            /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier $APP_ID" "$ENTITLEMENTS_APP" || \
              /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $APP_ID" "$ENTITLEMENTS_APP"
          else
            echo "No provisioning profile secret set; signing with Developer ID baseline entitlements only."
          fi

          echo "::group::Signing embedded frameworks"

          # Sign Sparkle 2.x components (innermost first)
          SPARKLE="$FRAMEWORKS/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            echo "Signing Sparkle components..."

            # XPC Services
            for xpc in "$SPARKLE/Versions/B/XPCServices/"*.xpc; do
              if [ -d "$xpc" ]; then
                echo "  Signing $(basename "$xpc")..."
                codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$xpc"
              fi
            done

            # Autoupdate helper
            if [ -f "$SPARKLE/Versions/B/Autoupdate" ]; then
              echo "  Signing Autoupdate..."
              codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$SPARKLE/Versions/B/Autoupdate"
            fi

            # Updater.app
            if [ -d "$SPARKLE/Versions/B/Updater.app" ]; then
              echo "  Signing Updater.app..."
              codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$SPARKLE/Versions/B/Updater.app"
            fi

            # Sign the framework itself
            echo "  Signing Sparkle.framework..."
            codesign --sign "$CERT_NAME" --options runtime --force --timestamp "$SPARKLE"
          fi

          # Sign remaining frameworks
          for fw in TransformerKit KeePassKit KissXML HNHUi; do
            FW_PATH="$FRAMEWORKS/${fw}.framework"
            if [ -d "$FW_PATH" ]; then
              echo "Signing $fw..."
              codesign --sign "$CERT_NAME" --options runtime --force --timestamp --entitlements "$ENTITLEMENTS_FRAMEWORK" "$FW_PATH"
            fi
          done

          echo "::endgroup::"

          echo "Signing $APP_NAME.app..."
          codesign --sign "$CERT_NAME" --options runtime --force --timestamp --entitlements "$ENTITLEMENTS_APP" "$APP"

          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP"

      # ── Notarize ────────────────────────────────────────────────
      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APP_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          BUILD_DIR="./build/Build/Products/$CONFIGURATION"
          APP="$BUILD_DIR/$APP_NAME.app"

          echo "Creating zip for notarization submission..."
          ditto -c -k --keepParent "$APP" "$BUILD_DIR/$APP_NAME-notarize.zip"

          echo "Submitting to Apple notarization service..."
          RESULT=$(xcrun notarytool submit "$BUILD_DIR/$APP_NAME-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PWD" \
            --wait \
            --timeout 30m \
            --output-format json) || true

          echo "$RESULT"
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','Unknown'))")
          SUB_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ "$STATUS" != "Accepted" ]; then
            echo "❌ Notarization failed with status: $STATUS"
            if [ -n "$SUB_ID" ]; then
              echo "Fetching notarization log..."
              xcrun notarytool log "$SUB_ID" \
                --apple-id "$APPLE_ID" \
                --team-id "$TEAM_ID" \
                --password "$APP_PWD"
            fi
            exit 1
          fi

          echo "✅ Notarization accepted"
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$APP"

          echo "Verifying notarization..."
          spctl --assess --type exec -vvv "$APP"

      # ── Package as PKG ──────────────────────────────────────────
      - name: Create PKG Installer
        env:
          CERT_NAME: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_NAME }}
        run: |
          BUILD_DIR="./build/Build/Products/$CONFIGURATION"
          APP="$BUILD_DIR/$APP_NAME.app"

          echo "Creating component pkg..."
          pkgbuild \
            --component "$APP" \
            --install-location /Applications \
            --version "$VERSION" \
            "$BUILD_DIR/$APP_NAME-component.pkg"

          echo "Creating distribution pkg..."
          productbuild \
            --package "$BUILD_DIR/$APP_NAME-component.pkg" \
            --sign "$CERT_NAME" \
            "$BUILD_DIR/$APP_NAME-$VERSION.pkg"

          # Also create an unsigned zip of the .app for users who prefer it
          echo "Creating zip archive..."
          ditto -c -k --keepParent "$APP" "$BUILD_DIR/$APP_NAME-$VERSION.zip"

          {
            echo "PKG_PATH=$BUILD_DIR/$APP_NAME-$VERSION.pkg"
            echo "ZIP_PATH=$BUILD_DIR/$APP_NAME-$VERSION.zip"
          } >> "$GITHUB_ENV"

      # ── Notarize PKG ────────────────────────────────────────────
      - name: Notarize PKG
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          APP_PWD: ${{ secrets.NOTARIZATION_PWD }}
        run: |
          echo "Submitting PKG to Apple notarization service..."
          xcrun notarytool submit "$PKG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PWD" \
            --wait \
            --timeout 30m

          echo "Stapling notarization ticket to PKG..."
          xcrun stapler staple "$PKG_PATH"

      # ── SHA256 ──────────────────────────────────────────────────
      - name: Generate SHA256 Hashes
        run: |
          shasum -a 256 "$PKG_PATH" > "$PKG_PATH.sha256"
          shasum -a 256 "$ZIP_PATH" > "$ZIP_PATH.sha256"

          {
            echo "### SHA256 Checksums"
            echo '```'
            cat "$PKG_PATH.sha256"
            cat "$ZIP_PATH.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Attestation ─────────────────────────────────────────────
      - name: Attest Build Provenance (PKG)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.PKG_PATH }}

      - name: Attest Build Provenance (ZIP)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ZIP_PATH }}

      # ── Generate Changelog ──────────────────────────────────────
      - name: Generate Changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$CURRENT_TAG" == *-* ]]; then
              # Pre-release (e.g. 1.2.3-rc1): changelog since last tag (any)
              PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
            else
              # Release (e.g. 1.2.3): changelog since last release tag (no suffix)
              PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" --exclude '*-*' 2>/dev/null || echo "")
            fi
            END_REF="$CURRENT_TAG"
          else
            # workflow_dispatch: changelog from last tag to HEAD
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
            END_REF="HEAD"
          fi

          echo "Generating changelog: ${PREV_TAG:-beginning}..${END_REF}"

          CHANGELOG_ARGS=(-P markdown -e "$END_REF")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG_ARGS+=(-s "$PREV_TAG")
          fi

          changelog_cli generate "${CHANGELOG_ARGS[@]}" -o /tmp/changelog.md || true

          if [ ! -s /tmp/changelog.md ]; then
            echo "No conventional commits found for changelog." > /tmp/changelog.md
          fi

          echo "Generated changelog:"
          cat /tmp/changelog.md

      # ── Publish ─────────────────────────────────────────────────
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Build release body: changelog + attestation info
          cp /tmp/changelog.md /tmp/release-body.md

          cat >> /tmp/release-body.md << 'EOF'

          ---- 
          
          **Verification**

          This release was built with GitHub Actions and includes [SLSA build provenance attestations](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds).

          To verify the artifacts:

          ```bash
          gh attestation verify MacPass-${{ env.VERSION }}.pkg --owner ${{ github.repository_owner }}
          gh attestation verify MacPass-${{ env.VERSION }}.zip --owner ${{ github.repository_owner }}
          ```

          **Build Info**

          - **Version**: ${{ env.VERSION }}
          - **Build**: ${{ env.BUILD_NUMBER }}
          - **Runner**: macOS 15 (arm64)
          - **Commit**: ${{ github.sha }}
          EOF

          # Create release with changelog + attestation info
          gh release create "${{ github.ref_name }}" \
            --title "MacPass ${{ env.VERSION }} (${{ env.BUILD_NUMBER }})" \
            --generate-notes \
            --notes-file /tmp/release-body.md \
            "${{ env.PKG_PATH }}" \
            "${{ env.PKG_PATH }}.sha256" \
            "${{ env.ZIP_PATH }}" \
            "${{ env.ZIP_PATH }}.sha256" 

      # ── Upload Artifacts (for workflow_dispatch) ────────────────
      - name: Upload Build Artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: MacPass-${{ github.sha }}
          path: |
            ${{ env.PKG_PATH }}
            ${{ env.PKG_PATH }}.sha256
            ${{ env.ZIP_PATH }}
            ${{ env.ZIP_PATH }}.sha256

      # ── Cleanup ─────────────────────────────────────────────────
      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  # ════════════════════════════════════════════════════════════════
  # Update Sparkle Appcast
  # ════════════════════════════════════════════════════════════════
  update-appcast:
    needs: build-sign-notarize
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Wait for release to propagate
        run: |
          echo "Waiting 30s for the GitHub release to become visible via the API..."
          sleep 30

      - name: Generate Appcast XML
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          # Start appcast XML
          cat > appcast.xml << 'HEADER'
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>MacPass Updates</title>
              <link>https://github.com/$REPO</link>
              <description>Most recent changes with links to updates.</description>
              <language>en</language>
          HEADER

          # Rewrite the repo URL into the template
          sed -i "s|\$REPO|${REPO}|g" appcast.xml

          # Query all releases and generate items
          # sparkle:version must be numeric (for version comparison).
          # Parse build number from release name/title with or without prefix,
          # e.g. "MacPass 0.8.3+rc2 (19)" or "0.8.3+rc2 (19)".
          gh api "repos/${REPO}/releases" --paginate --jq '.[] | select(.draft == false)' | \
          jq -c '.' | while read -r release; do
            TAG=$(echo "$release" | jq -r '.tag_name')
            NAME=$(echo "$release" | jq -r '.name // .tag_name')
            PUB_DATE=$(echo "$release" | jq -r '.published_at')

            # Find the .zip asset (exclude noSparkle variant — appcast is for Sparkle updates only)
            ZIP_URL=$(echo "$release" | jq -r '[.assets // [] | .[] | select((.name | endswith(".zip")) and (.name | contains("noSparkle") | not))] | first // empty | .browser_download_url')
            ZIP_SIZE=$(echo "$release" | jq -r '[.assets // [] | .[] | select((.name | endswith(".zip")) and (.name | contains("noSparkle") | not))] | first // empty | .size')
            if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
              continue
            fi

            # Parse numeric build number from a trailing "(N)"
            BUILD_NUM=$(echo "$NAME" | sed -nE 's/.*\(([0-9]+)\)[[:space:]]*$/\1/p' | head -n1)
            if [ -z "$BUILD_NUM" ]; then
              echo "Skipping release $TAG: could not parse build number from title '$NAME'"
              continue
            fi

            printf '    <item>\n' >> appcast.xml
            printf '      <title>%s</title>\n' "$NAME" >> appcast.xml
            printf '      <pubDate>%s</pubDate>\n' "$PUB_DATE" >> appcast.xml
            printf '      <sparkle:version>%s</sparkle:version>\n' "$BUILD_NUM" >> appcast.xml
            printf '      <sparkle:shortVersionString>%s</sparkle:shortVersionString>\n' "$TAG" >> appcast.xml
            printf '      <sparkle:minimumSystemVersion>10.14</sparkle:minimumSystemVersion>\n' >> appcast.xml
            printf '      <enclosure\n' >> appcast.xml
            printf '        url="%s"\n' "$ZIP_URL" >> appcast.xml
            printf '        length="%s"\n' "$ZIP_SIZE" >> appcast.xml
            printf '        type="application/octet-stream"\n' >> appcast.xml
            printf '        sparkle:version="%s"\n' "$BUILD_NUM" >> appcast.xml
            printf '        sparkle:shortVersionString="%s"\n' "$TAG" >> appcast.xml
            printf '      />\n' >> appcast.xml
            printf '    </item>\n' >> appcast.xml
          done

          # Close appcast XML
          cat >> appcast.xml << 'FOOTER'
            </channel>
          </rss>
          FOOTER

          # Move to a dedicated directory for gh-pages deployment
          mkdir -p _site
          mv appcast.xml _site/appcast.xml

          echo "Generated appcast.xml:"
          cat _site/appcast.xml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
