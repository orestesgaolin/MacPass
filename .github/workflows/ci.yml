name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: MacPass.xcodeproj
  SCHEME: MacPass

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test AutoFill release validators
        run: python3 scripts/test_autofill_release_validators.py

      - name: Install Carthage
        run: brew install carthage

      - name: Fetch dependencies
        env:
          GITHUB_ACCESS_TOKEN: ${{ github.token }}
        run: carthage bootstrap --no-build

      - name: Fix TransformerKit compatibility
        run: ./scripts/fix_transformerkit.sh

      - name: Build frameworks
        shell: bash
        run: |
          set -euo pipefail

          architecture="$(uname -m)"
          readonly architecture
          framework_dir="$PWD/Carthage/Build/Mac"
          readonly framework_dir
          build_root="$RUNNER_TEMP/macpass-frameworks"
          readonly build_root
          mkdir -p "$framework_dir"

          sparkle_version="$(grep -i sparkle Cartfile.resolved | grep -oE '"[0-9][^"]*"' | tail -1 | tr -d '"')"
          curl --fail --location --silent --show-error \
            "https://github.com/sparkle-project/Sparkle/releases/download/${sparkle_version}/Sparkle-${sparkle_version}.tar.xz" \
            --output "$RUNNER_TEMP/Sparkle.tar.xz"
          mkdir -p "$build_root/Sparkle"
          tar xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$build_root/Sparkle"
          cp -R "$build_root/Sparkle/Sparkle.framework" "$framework_dir/"

          xcodebuild build \
            -project Carthage/Checkouts/HNHUi/HNHUi.xcodeproj \
            -scheme HNHUi -configuration Release \
            ARCHS="$architecture" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$build_root/HNHUi" OBJROOT="$build_root/HNHUi-obj"
          cp -R "$build_root/HNHUi/Release/HNHUi.framework" "$framework_dir/"

          xcodebuild build \
            -project Carthage/Checkouts/KissXML/KissXML.xcodeproj \
            -scheme "KissXML (macOS)" -configuration Release \
            ARCHS="$architecture" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$build_root/KissXML" OBJROOT="$build_root/KissXML-obj"
          cp -R "$build_root/KissXML/Release/KissXML.framework" "$framework_dir/"

          mkdir -p Carthage/Checkouts/KeePassKit/Carthage/Build/Mac
          ln -sf "$framework_dir/KissXML.framework" \
            Carthage/Checkouts/KeePassKit/Carthage/Build/Mac/KissXML.framework
          xcodebuild build \
            -project Carthage/Checkouts/KeePassKit/KeePassKit.xcodeproj \
            -target "KeePassKit macOS" -configuration Release \
            ARCHS="$architecture" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$build_root/KeePassKit" OBJROOT="$build_root/KeePassKit-obj"
          cp -R "$build_root/KeePassKit/Release/KeePassKit.framework" "$framework_dir/"

          xcodebuild build \
            -workspace Carthage/Checkouts/TransformerKit/TransformerKit.xcworkspace \
            -scheme "TransformerKit macOS" -configuration Release \
            -derivedDataPath "$build_root/TransformerKit" \
            ARCHS="$architecture" SDKROOT=macosx \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cp -R "$build_root/TransformerKit/Build/Products/Release/TransformerKit.framework" \
            "$framework_dir/"

          for framework in KeePassKit HNHUi TransformerKit KissXML Sparkle; do
            test -d "$framework_dir/$framework.framework"
          done

      # Build the test host first. The legacy test target does not declare its
      # host as a target dependency, so recent Xcode versions can otherwise try
      # to link the test bundle before MacPass.app exists. Ad-hoc signing lets
      # XCTest attach on hosted runners without requiring signing secrets.
      - name: Build MacPass
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/macpass-derived-data" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_HARDENED_RUNTIME=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="0.0.0" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Scan product for AutoFill fixture data
        shell: bash
        run: |
          set -euo pipefail
          product="$RUNNER_TEMP/macpass-derived-data/Build/Products/Debug/MacPass.app"
          scripts/validate_autofill_product.sh "$product" "$(uname -m)"
          patterns='resolved-secret|trashed-secret|Test_Password_1234|AutoFill_KDBX4_Password|AutoFill_KeyFileV2|https://example\.com|/tmp/Database\.kdbx'
          if python3 scripts/scan_autofill_artifact.py "$product" "$patterns" \
              --exclude-suffix .xctest > "$RUNNER_TEMP/autofill-product-findings.txt"; then
            :
          else
            status=$?
            if [ "$status" -eq 2 ]; then exit 2; fi
            echo "AutoFill fixture data was found in the application product."
            while IFS= read -r path; do echo "::error file=$path::Sensitive AutoFill fixture marker found"; done \
              < "$RUNNER_TEMP/autofill-product-findings.txt"
            exit 1
          fi

      # Keep the healthy suite and all new tests gated while the six explicitly
      # listed legacy tests remain broken on current macOS/Xcode versions.
      - name: Test MacPass
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/macpass-derived-data" \
            -resultBundlePath "$RUNNER_TEMP/MacPass-CI.xcresult" \
            -skip-testing:MacPassTests/MPDatabaseLoading/testLoadVersion1 \
            -skip-testing:MacPassTests/MPDatabaseLoading/testVersion1WrongPassword \
            -skip-testing:MacPassTests/MPDatabaseSearch/testSearch \
            -skip-testing:MacPassTests/MPTestAutotypeDelay/testDelayExecution \
            -skip-testing:MacPassTests/MPTestKeyMapper/testKeyMapper \
            -skip-testing:MacPassTests/MPTestPluginVersion/testVersionCompare \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_HARDENED_RUNTIME=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="0.0.0" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Scan test evidence for AutoFill fixture data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/MacPass-CI.xcresult"
          test -d "$result"
          patterns='resolved-secret|trashed-secret|Test_Password_1234|/tmp/Database\.kdbx'
          if python3 scripts/scan_autofill_artifact.py "$result" "$patterns" \
              > "$RUNNER_TEMP/autofill-evidence-findings.txt"; then
            :
          else
            status=$?
            if [ "$status" -eq 2 ]; then exit 2; fi
            echo "AutoFill fixture data was found in the test evidence."
            while IFS= read -r path; do echo "::error file=$path::Sensitive AutoFill fixture marker found"; done \
              < "$RUNNER_TEMP/autofill-evidence-findings.txt"
            exit 1
          fi

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacPass-CI-xcresult
          path: ${{ runner.temp }}/MacPass-CI.xcresult
          if-no-files-found: error
          retention-days: 14
